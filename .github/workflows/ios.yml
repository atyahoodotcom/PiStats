name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode and schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project PiStats.xcodeproj

      - name: Remove Watch app from iPhone target (CI copy only)
        shell: bash
        run: |
          python3 - <<'PY'
          p = 'PiStats.xcodeproj/project.pbxproj'
          s = open(p).read()
          dep = "\t\t\t\t3196111A301362D6009205E5 /* PBXTargetDependency */,\n"
          emb = "\t\t\t\t3196111C301362D6009205E5 /* Embed Watch Content */,\n"
          if s.count(dep) == 1 and s.count(emb) == 1:
              open(p, 'w').write(s.replace(dep, '').replace(emb, ''))
              print("Watch app removed from iPhone target")
          else:
              print("Patch pattern not found, building unpatched")
          PY

      - name: Build (unsigned)
        shell: bash
        run: |
          mkdir -p logs
          if ! xcodebuild build \
            -project PiStats.xcodeproj \
            -scheme "iOS" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > logs/build.log 2>&1; then
            echo "BUILD FAILED. Error lines:"
            grep -n -E "error:" logs/build.log | head -n 30 || true
            exit 1
          fi
          tail -n 5 logs/build.log

      - name: Package IPA
        shell: bash
        run: |
          APP="build/Build/Products/Release-iphoneos/Pi Stats Mobile.app"
          echo "--- Products ---"
          find build/Build/Products -maxdepth 2 | sort
          test -d "$APP" || { echo "App not found"; exit 1; }

          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          PLAT=$(/usr/libexec/PlistBuddy -c "Print :DTPlatformName" "$APP/Info.plist")
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "executable=$EXE platform=$PLAT id=$BID"
          test "$PLAT" = "iphoneos"
          test -f "$APP/$EXE"

          rm -rf Payload PiStatsMobile-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry PiStatsMobile-unsigned.ipa Payload

          ls -lh PiStatsMobile-unsigned.ipa
          SIZE=$(stat -f%z PiStatsMobile-unsigned.ipa)
          echo "IPA size: $SIZE bytes"
          test "$SIZE" -gt 1000000

      - uses: actions/upload-artifact@v6
        with:
          name: PiStatsMobile-unsigned-ipa
          path: PiStatsMobile-unsigned.ipa

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: build-logs
          path: logs
